<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Agile-to-Validation Bridge</title>
<style>
  :root { --ink:#1b1f24; --muted:#5b6470; --line:#dde1e6; --bg:#f6f7f9; --card:#fff; --accent:#2457d6; --high:#c2362b; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; color:var(--ink); background:var(--bg);
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:24px; width:100%; max-width:360px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:13px; margin:0 0 8px; }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 4px; }
  input { width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  button { width:100%; margin-top:18px; background:var(--accent); color:#fff; border:0; border-radius:6px; padding:10px 14px; font:inherit; font-weight:600; cursor:pointer; }
  .error { display:none; background:#fdecea; border:1px solid #f5c2bd; color:var(--high); border-radius:6px; padding:8px 10px; font-size:13px; margin-top:12px; }
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <h1>Agile-to-Validation Bridge</h1>
  <p class="muted">Sign in to continue. Your username is recorded in the audit trail.</p>
  <div class="error" id="err">Wrong username or password.</div>
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
<script>
  if (new URLSearchParams(location.search).has("error")) document.getElementById("err").style.display = "block";
</script>
</body>
</html>
