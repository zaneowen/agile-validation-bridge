# Render Blueprint: New > Blueprint > pick this repo.
# You will be asked for the two secret values (sync: false) on first deploy.
services:
  - type: web
    name: agile-validation-bridge
    runtime: docker
    plan: starter            # a persistent disk needs a paid plan; see README for the free option
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AVB_USERS        # e.g. qa.lead:long-password,dev1:another-password
        sync: false
      - key: AVB_MODEL
        value: claude-sonnet-5-5
      - key: AVB_DB
        value: /data/avb.db
    disk:
      name: avb-data
      mountPath: /data
      sizeGB: 1
